services:
  - type: web
    name: chandan-portfolio-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "https://chandan-ai-engineer.vercel.app"
      - key: RESEND_API_KEY
        sync: false
